name = "wtrack"
main = "src/index.ts"
compatibility_date = "2025-03-01"

# Set these with `wrangler secret put`; never add their values to this file:
# ALPACA_API_KEY and ALPACA_API_SECRET_KEY
# WEBHOOK_URL is optional; TELEGRAM_CHAT_ID is required when using Telegram.

[triggers]
crons = ["30 20 * * 1-5", "30 21 * * 1-5", "15 14 * * 1-5", "15 15 * * 1-5"]

[[durable_objects.bindings]]
name = "PAPER_TRADING"
class_name = "PaperTrading"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PaperTrading"]

[[kv_namespaces]]
binding = "WTRACK_KV"
id = "9bcf9184bb5d4709936b42f0abeb3e60"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
