name = "stock-tracker"
main = "src/index.ts"
compatibility_date = "2025-03-01"

# Set these with `wrangler secret put`; never add their values to this file:
# ALPACA_API_KEY, ALPACA_API_SECRET_KEY, WEBHOOK_URL, ADMIN_TOKEN
# TELEGRAM_CHAT_ID is also required when using Telegram.

[triggers]
crons = ["30 21 * * 1-5"]

[[kv_namespaces]]
binding = "STOCK_TRACKER_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
