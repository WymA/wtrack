name = "wtrack"
main = "src/index.ts"
compatibility_date = "2025-03-01"

# Set these with `wrangler secret put`; never add their values to this file:
# ALPACA_API_KEY, ALPACA_API_SECRET_KEY, WEBHOOK_URL
# TELEGRAM_CHAT_ID is also required when using Telegram.

[triggers]
crons = ["30 21 * * 1-5"]

[[kv_namespaces]]
binding = "WTRACK_KV"
id = "9bcf9184bb5d4709936b42f0abeb3e60"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
